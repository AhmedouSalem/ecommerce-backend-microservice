spring.datasource.url = jdbc:mysql://localhost:3306/review-service-db

# === App Name
otel.resource.attributes.service.name=review-service
# === Export des TRACES via OTLP
otel.traces.exporter=otlp
otel.exporter.otlp.traces.endpoint=http://otel-collector:4317
otel.exporter.otlp.protocol=grpc

# === Export des METRICS via OTLP
otel.metrics.exporter=otlp
otel.exporter.otlp.metrics.endpoint=http://otel-collector:4317

# === Debug utile
otel.javaagent.debug=true
logging.level.io.opentelemetry=DEBUG