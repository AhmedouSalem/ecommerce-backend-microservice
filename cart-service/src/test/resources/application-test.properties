# Déconnecter du Config Server pour les tests
spring.config.import=optional:classpath:/application.properties

# Base de données H2 pour les tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate
spring.jpa.hibernate.ddl-auto=update

# Clé fictive pour JWT
ecom.token=test-token

# Désactiver la validation du datasource (optionnel si erreur persiste)
spring.sql.init.mode=always
