spring.application.name=gateway-service
server.port=8891


spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
#app.client.url=http://ecommerce-web:4200
app.client.url=http://localhost:4200

# config static (voir a.yml) ou dynamic

management.endpoints.web.exposure.include=*
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka

eureka.instance.prefer-ip-address=true

# intercepter et convertire le nom de microservice en Majuscule
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

ecom.token=ecom-token
jwt.secret=VEhJU0lTQVZFRVJZTE9OR0FORFNFQ1VSRVNFQ1JFVEtFWUZPUkpXVEdFTkVSQVRJT05CWUFSWUFOUEFUSUwxVEhJU0lTQVZFRVJZTE9OR0FORFNFQ1VSRVNFQ1JFVEtFWUZPUkpXVEdFTkVSQVRJT05CWUFSWUFOUEFUSUwy
management.prometheus.metrics.export.enabled=true
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=gateway-service
spring.cloud.gateway.metrics.enabled=true



# === App Name
otel.resource.attributes.service.name=gateway-service
# === Export des TRACES via OTLP
otel.traces.exporter=otlp
otel.exporter.otlp.traces.endpoint=http://otel-collector:4317
otel.exporter.otlp.protocol=grpc

# === Export des METRICS via OTLP
otel.metrics.exporter=otlp
otel.exporter.otlp.metrics.endpoint=http://otel-collector:4317

management.metrics.export.otlp.enabled=true
management.metrics.export.otlp.step=5s
management.metrics.export.otlp.url=http://otel-collector:4318/v1/metrics

# === Debug utile
#otel.javaagent.debug=true
logging.level.io.opentelemetry=DEBUG