      MYSQL_PASSWORD: password
    ports:
      - "3313:3306"
    volumes:
      - mysql-review-data:/var/lib/mysql
    networks:
      - ecom-network


volumes:
  mysql-user-data:
  mysql-order-data:
  mysql-category-data:
  mysql-coupon-data:
  mysql-product-data:
  mysql-cart-data:
  mysql-review-data:


networks:
  ecom-network:
    name: ecom-network
    driver: bridge
