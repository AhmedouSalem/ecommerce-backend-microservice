      - mysql-coupon-data:/var/lib/mysql
    networks:
      - ecom-network

  mysql-product:
    image: mysql:8
    container_name: mysql-product
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product-service-db
      MYSQL_USER: username
      MYSQL_PASSWORD: password
