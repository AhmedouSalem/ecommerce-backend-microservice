services:
  config-service:
    build: ./config-service
    container_name: config-service
    ports:
      - "9999:9999"
    networks:
      - ecom-network

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    depends_on:
      - config-service
    networks:
      - ecom-network

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8891:8891"
    depends_on:
      - config-service
      - discovery-service
      - user-service
      - product-service
      - category-service
      - coupon-service
      - order-service
      - cart-service
    networks:
      - ecom-network

  ecommerce-web:
    build: ./e-commerce-web
    container_name: ecommerce-web
    ports:
      - "4200:4200"
    depends_on:
      - gateway-service
    networks:
      - ecom-network

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8091:8091"
    depends_on:
      - config-service
      - discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - ecom-network

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8084:8084"
    depends_on:
      - config-service
      - discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - ecom-network

  category-service:
    build: ./Category-service
    container_name: category-service
    ports:
      - "8087:8087"
    depends_on:
      - config-service
      - discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - ecom-network

  coupon-service:
    build: ./coupon-service
    container_name: coupon-service
    ports:
      - "8085:8085"
    depends_on:
      - config-service
      - discovery-service
      - user-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - ecom-network

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8086:8086"
    depends_on:
      - config-service
      - discovery-service
      - category-service
      - user-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - ecom-network

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports:
      - "8089:8089"
    depends_on:
      - config-service
      - discovery-service
      - category-service
      - user-service
      - product-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - ecom-network

  review-service:
    build: ./review-service
    container_name: review-service
    ports:
      - "8090:8090"
    depends_on:
      - config-service
      - discovery-service
      - product-service
      - user-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - ecom-network

networks:
  ecom-network:
    external: true
